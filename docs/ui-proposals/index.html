<title>History Unfolded HUD</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+SC:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: a walnut presentation table; each proposal is a set of fixed-size game "stages" scaled to fit. */
  :root {
    --table: #1d1711;
    --table2: #2a2118;
    --chalk: #efe6d2;
    --chalk2: #b9a988;
    --pin: #d6b46a;
    --f-page: 'Cormorant Garamond', Georgia, serif;
    --f-ui: 'EB Garamond', Georgia, serif;
    color-scheme: dark;
  }
  body {
    background: var(--table);
    color: var(--chalk);
    font-family: var(--f-ui);
  }
  .page {
    padding-block: 28px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 1500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .intro {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 32px;
    align-items: end;
    justify-content: space-between;
  }
  .intro h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(26px, 3.4vw, 40px);
    letter-spacing: 0.06em;
    margin: 0;
    text-wrap: balance;
    color: var(--chalk);
  }
  .intro p {
    margin: 6px 0 0;
    color: var(--chalk2);
    font-size: 17px;
    max-width: 62ch;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tab {
    font:
      600 15px/1 'Cinzel',
      serif;
    letter-spacing: 0.08em;
    color: var(--chalk2);
    background: var(--table2);
    border: 1px solid #4a3c2a;
    border-radius: 999px;
    padding: 11px 18px;
    cursor: pointer;
  }
  .tab b {
    color: var(--pin);
    margin-right: 6px;
  }
  .tab[aria-selected='true'] {
    color: #1d1711;
    background: var(--pin);
    border-color: var(--pin);
  }
  .tab[aria-selected='true'] b {
    color: #1d1711;
  }
  .tab:focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: 2px;
  }
  .pitch {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px 40px;
    border-top: 1px solid #3d3122;
    padding-top: 18px;
  }
  .pitch h2 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.04em;
    grid-column: 1/-1;
  }
  .pitch p {
    margin: 0;
    color: var(--chalk2);
    font-size: 17px;
    line-height: 1.45;
  }
  .pitch ul {
    margin: 0;
    padding-left: 18px;
    color: var(--chalk2);
    font-size: 16px;
    line-height: 1.5;
  }
  .cap {
    font:
      600 13px/1 'Cinzel',
      serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pin);
    margin: 0 0 8px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
  }
  @media (max-width: 820px) {
    .grid2,
    .pitch {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .stage > .cv {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }

  /* ================================================================= shared component skeleton */
  .cv {
    font-family: var(--body);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.3;
  }
  .cv * {
    box-sizing: border-box;
  }
  .cv svg.i {
    width: 1.15em;
    height: 1.15em;
    vertical-align: -0.2em;
    flex: none;
  }
  .map {
    position: absolute;
    inset: 0;
    background: url(img/map.jpg) center/cover;
  }
  .abs {
    position: absolute;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .col {
    display: flex;
    flex-direction: column;
  }
  .num {
    font-variant-numeric: tabular-nums lining-nums;
  }
  .plus {
    color: var(--good);
    font-size: 0.82em;
  }
  .minus {
    color: var(--bad);
  }
  .muted {
    color: var(--muted);
  }
  .h {
    font-family: var(--display);
  }
  .label {
    font-family: var(--label);
    text-transform: var(--label-case, uppercase);
    letter-spacing: var(--label-ls, 0.12em);
    font-size: 12.5px;
    color: var(--muted);
  }
  .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--track);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: var(--btnfont, var(--display));
    font-size: 15px;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    border-radius: var(--r-btn);
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--btn);
    color: var(--ink);
    white-space: nowrap;
  }
  .btn.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }
  .btn.ghost {
    background: transparent;
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: default;
  }
  .ib {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--label);
  }
  .ib > span {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: var(--r-ib);
    border: 1px solid var(--line);
    background: var(--btn);
    color: var(--accent);
  }
  .ib > span svg {
    width: 22px;
    height: 22px;
  }
  .ib.on > span {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--chipbg);
    font-size: 14px;
    border: 1px solid var(--line-soft);
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
  }

  /* resource bar */
  .res {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .res .r {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 18px;
  }
  .res .r svg {
    width: 22px;
    height: 22px;
    color: var(--icon);
  }
  .crest {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    color: var(--on-accent);
    background: var(--crest);
    border: 2px solid var(--gold);
  }
  .crest svg {
    width: 30px;
    height: 30px;
  }

  /* trackers */
  .trk {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 14px;
    width: 300px;
  }
  .trk .ico {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: var(--on-accent);
    border: 2px solid var(--gold);
    flex: none;
  }
  .trk .ico svg {
    width: 22px;
    height: 22px;
  }
  .trk .t {
    flex: 1;
    min-width: 0;
  }
  .trk .t b {
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
    display: block;
  }
  .trk .t .row {
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }

  /* notifications */
  .notes {
    width: 330px;
    padding: 12px 16px;
  }
  .notes h4 {
    margin: 0 0 6px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .notes ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .notes li {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 15px;
  }
  .notes li:first-child {
    border-top: 0;
  }
  .notes li svg {
    width: 18px;
    height: 18px;
    color: var(--icon);
    flex: none;
  }

  /* unit card */
  .unit {
    width: 430px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .unit .top {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .portrait {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: var(--portrait) center/contain no-repeat;
    border: 2px solid var(--gold);
    flex: none;
    box-shadow: inset 0 0 0 3px var(--panel);
  }
  .unit h3 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 24px;
    line-height: 1.1;
  }
  .unit .sub {
    font-size: 15px;
    color: var(--muted);
  }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 16px;
    padding: 8px 0;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }
  .stats span {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stats svg {
    width: 18px;
    height: 18px;
    color: var(--icon);
  }
  .coh {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: calc(var(--r) - 2px);
    background: var(--sunk);
    border: 1px solid var(--line-soft);
  }
  .coh .n {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    min-width: 34px;
    text-align: center;
  }
  .coh .d {
    flex: 1;
    font-size: 14px;
    color: var(--muted);
  }
  .coh .d b {
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
    font-family: var(--display);
  }
  .step {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: var(--r-btn);
    overflow: hidden;
  }
  .step i {
    font-style: normal;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .step i + i {
    border-left: 1px solid var(--line-soft);
  }
  .acts {
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }

  /* end turn */
  .endturn {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    text-align: center;
    cursor: pointer;
    color: var(--on-accent);
    background: var(--end);
    border: 3px solid var(--gold);
    box-shadow:
      0 0 0 5px var(--panel),
      0 0 0 6px var(--gold),
      0 10px 26px rgba(40, 25, 10, 0.4);
  }
  .endturn b {
    font-family: var(--display);
    font-size: 25px;
    font-weight: 600;
    line-height: 1.05;
    display: block;
  }
  .endturn small {
    display: block;
    font-size: 12.5px;
    opacity: 0.85;
    margin-top: 4px;
    font-family: var(--body);
  }

  /* minimap */
  .mini {
    width: 250px;
    padding: 8px;
    display: flex;
    gap: 8px;
  }
  .mini .m {
    width: 190px;
    height: 107px;
    background: url(img/mini.jpg) center/cover;
    border: 1px solid var(--line);
    position: relative;
    border-radius: calc(var(--r) - 4px);
  }
  .mini .m i {
    position: absolute;
    left: 62px;
    top: 30px;
    width: 58px;
    height: 40px;
    border: 1.5px solid var(--ink);
  }
  .mini .tools {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mini .tools span {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted);
    background: var(--btn);
  }
  .mini .tools svg {
    width: 17px;
    height: 17px;
  }

  /* dialogs */
  .dlg {
    position: absolute;
    inset: 0;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .dlg > header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  .dlg > header h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.03em;
  }
  .dlg > header .sp {
    flex: 1;
  }
  .dlg .x {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .dlg .body {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 18px;
    padding: 18px 24px;
  }
  .tabs2 {
    display: flex;
    gap: 4px;
  }
  .tabs2 span {
    padding: 7px 14px;
    font-family: var(--label);
    font-size: 14px;
    letter-spacing: 0.06em;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-btn);
    color: var(--muted);
    background: var(--btn);
  }
  .tabs2 span.on {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }

  /* city */
  .city .body {
    grid-template-columns: 270px 1fr 290px;
  }
  .cityhead {
    height: 140px;
    border-radius: calc(var(--r) - 2px);
    background:
      url(img/city-town.png) center/contain no-repeat,
      var(--sunk);
    border: 1px solid var(--line-soft);
  }
  .yields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .yields div {
    padding: 8px 10px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 4px);
    background: var(--sunk);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .yields b {
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .yields b svg {
    color: var(--icon);
    width: 18px;
    height: 18px;
  }
  .dgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    max-height: 370px;
    margin: 0 auto;
  }
  .slot {
    border: 1px solid var(--line);
    border-radius: calc(var(--r) - 4px);
    background: var(--btn);
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 13px;
    position: relative;
  }
  .slot b {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
  }
  .slot .tag {
    font-size: 11.5px;
    color: var(--muted);
  }
  .slot svg {
    width: 24px;
    height: 24px;
    color: var(--icon);
  }
  .slot.empty {
    background: transparent;
    border-style: dashed;
    color: var(--muted);
    align-items: center;
    justify-content: center;
  }
  .slot.hall {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }
  .slot.hall .tag,
  .slot.hall svg {
    color: var(--on-accent);
  }
  .slot.sel {
    box-shadow: 0 0 0 2px var(--gold);
  }
  .slot .bar {
    height: 4px;
  }
  .stock {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* research */
  .research .body {
    grid-template-columns: 1fr 290px;
  }
  .tree {
    position: relative;
  }
  .tree svg.links {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .tree svg.links path {
    fill: none;
    stroke: var(--link);
    stroke-width: 2;
  }
  .node {
    position: absolute;
    width: 196px;
    padding: 9px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: var(--r-node);
  }
  .node .ni {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    color: var(--icon);
    background: var(--panel);
    flex: none;
  }
  .node .ni svg {
    width: 18px;
    height: 18px;
  }
  .node b {
    font-family: var(--display);
    font-weight: 600;
    font-size: 15px;
    display: block;
    line-height: 1.1;
  }
  .node small {
    font-size: 12px;
    color: var(--muted);
  }
  .node.done {
    background: var(--sunk);
  }
  .node.done .ni {
    background: var(--good);
    color: var(--panel);
    border-color: var(--good);
  }
  .node.active {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }
  .node.active small {
    color: var(--on-accent);
    opacity: 0.85;
  }
  .node.active .ni {
    background: var(--on-accent);
    color: var(--accent);
  }
  .node.locked {
    opacity: 0.6;
  }
  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--line-soft);
    border-radius: var(--r);
    background: var(--sunk);
  }
  .side h3 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 22px;
  }
  .side ul {
    margin: 0;
    padding-left: 18px;
    font-size: 15px;
    line-height: 1.45;
  }

  /* peoples */
  .peoples .body {
    grid-template-columns: 330px 1fr;
  }
  .plist {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .p {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 3px);
    background: var(--btn);
  }
  .p.sel {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .sw {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: none;
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line);
  }
  .sw.free {
    border-radius: 6px;
    transform: rotate(45deg) scale(0.78);
  }
  .p b {
    font-family: var(--display);
    font-weight: 600;
    font-size: 16px;
    display: block;
  }
  .p small {
    font-size: 12.5px;
    color: var(--muted);
  }
  .p .sp {
    flex: 1;
  }
  .pill {
    font-size: 12.5px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .pill.good {
    color: var(--good);
  }
  .pill.bad {
    color: var(--bad);
  }
  .pill.mid {
    color: var(--muted);
  }
  .pill.ally {
    color: var(--accent);
    background: var(--gold-soft);
  }
  .detail {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .ladder {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .ladder div {
    padding: 10px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 3px);
    background: var(--sunk);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ladder div b {
    font-family: var(--display);
    font-size: 16px;
    color: var(--ink);
  }
  .ladder div.now {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }
  .ladder div.now b {
    color: var(--on-accent);
  }
  .ladder div.war {
    border-color: color-mix(in srgb, var(--bad) 50%, transparent);
  }
  .ops {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .ops .box {
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 3px);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
  }
  .ops .box h5 {
    margin: 0;
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
  }
  .reason {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    border-top: 1px dotted var(--line-soft);
    padding: 4px 0;
  }
  .req {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .req svg {
    width: 15px;
    height: 15px;
  }
  .req.ok svg {
    color: var(--good);
  }
  .req.no {
    color: var(--muted);
  }

  /* event */
  .event {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(30, 20, 10, 0.25);
  }
  .ev {
    width: 760px;
    padding: 0 0 22px;
    overflow: hidden;
  }
  .ev .art {
    height: 150px;
    position: relative;
    background: url(img/map.jpg) 48% 42%/180% auto;
    border-bottom: 1px solid var(--line);
  }
  .ev .art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, var(--panel));
  }
  .ev .art .seal {
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    z-index: 1;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    border: 2px solid var(--gold);
    color: var(--on-accent);
  }
  .ev .art .seal svg {
    width: 30px;
    height: 30px;
  }
  .ev .in {
    padding: 16px 34px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ev h2 {
    margin: 0;
    text-align: center;
    font-family: var(--display);
    font-weight: 600;
    font-size: 30px;
  }
  .ev .eyebrow {
    text-align: center;
  }
  .ev p {
    margin: 0;
    font-size: 18px;
    line-height: 1.5;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: calc(var(--r) - 2px);
    background: var(--btn);
  }
  .choice b {
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
    display: block;
  }
  .choice small {
    color: var(--muted);
    font-size: 14.5px;
  }
  .choice .k {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--gold);
    color: var(--accent);
    font-family: var(--display);
    font-weight: 700;
    flex: none;
  }
  .choice.hot {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold-soft);
  }

  /* menu */
  .menu {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 0;
  }
  .menu .left {
    padding: 56px 48px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }
  .menu .title {
    font-family: var(--display);
    font-weight: 600;
    font-size: 54px;
    line-height: 0.98;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .menu .tag {
    font-size: 17px;
    color: var(--muted);
    margin: 4px 0 22px;
  }
  .mbtn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: var(--r-btn);
    background: var(--btn);
    font-family: var(--display);
    font-size: 19px;
    letter-spacing: 0.04em;
  }
  .mbtn small {
    font-family: var(--body);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0;
  }
  .mbtn.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent-edge);
  }
  .mbtn.primary small {
    color: var(--on-accent);
    opacity: 0.8;
  }
  .setup {
    margin: 40px 40px 40px 0;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .setup h3 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 24px;
  }
  .maps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .maps div {
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--r) - 3px);
    background: var(--btn);
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .maps div b {
    font-family: var(--display);
    font-size: 16px;
    color: var(--ink);
  }
  .maps div.on {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
    background: var(--sunk);
  }
  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: var(--r-btn);
    overflow: hidden;
  }
  .seg span {
    flex: 1;
    text-align: center;
    padding: 7px 0;
    font-size: 14px;
    color: var(--muted);
    background: var(--btn);
  }
  .seg span + span {
    border-left: 1px solid var(--line-soft);
  }
  .seg span.on {
    background: var(--accent);
    color: var(--on-accent);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .input {
    border: 1px solid var(--line);
    border-radius: var(--r-btn);
    padding: 7px 10px;
    background: var(--panel);
    font-size: 15px;
  }

  /* ================================================================= A · Ivory Codex */
  .A {
    --panel: #f7f1e3;
    --sunk: #efe6d1;
    --btn: #fbf7ee;
    --chipbg: #f1e8d4;
    --ink: #2a2419;
    --muted: #76674d;
    --line: #c9b083;
    --line-soft: #e0d2b4;
    --accent: #2f6a60;
    --accent-edge: #1f4c45;
    --on-accent: #fbf7ee;
    --gold: #b8924a;
    --gold-soft: #e7d6ac;
    --icon: #9a7a3b;
    --good: #4c7a3a;
    --bad: #a2402f;
    --track: #e3d7bd;
    --link: #b89a63;
    --crest: #2f6a60;

  .A .top-band {
    left: 0;
    right: 0;
    top: 0;
    height: 64px;
    background: linear-gradient(#f9f4e8, #efe5cf);

    box-shadow:
      0 2px 0 var(--gold-soft),
      0 6px 18px rgba(60, 40, 15, 0.2);
    display: flex;
    align-items: center;
    padding: 0 18px 0 120px;

  }
  .A .crest {
    position: absolute;
    left: 24px;

    width: 76px;
    height: 86px;
    border-radius: 0 0 38px 38px;

  }
  .A .crest svg {
    width: 38px;
    height: 38px;
  }
  .A .civ {
    font-family: var(--display);
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.05em;
  }
  .A .turn {
    margin-left: auto;
    font-family: var(--body);
    font-size: 19px;
    letter-spacing: 0.04em;
  }
  .A .unit h3,
  .A .node b {
    font-family: 'EB Garamond', serif;
    font-size: 26px;
  }
  .A .node b {
    font-size: 16.5px;
  }
  .A .roundbtn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    background: var(--btn);
    color: var(--icon);
  }
  .A .trk {
    border-radius: 12px;
  }
  .A .slot.hall {
    background: linear-gradient(#3b7d72, #2a5f56);
  }
  .A h2.h,
  .A .dlg > header h2 {
    color: #2a2419;
  }
  .A .dlg > header {
    background: linear-gradient(#f9f4e8, #f1e8d4);
  }
  .A .laurel {
    color: var(--gold);
    width: 46px;
    height: 23px;
  }
  .A .menu {
    background:
      linear-gradient(90deg, rgba(247, 241, 227, 0.97) 0 440px, rgba(247, 241, 227, 0.55)),
      url(img/map.jpg) center/cover;
  }

  .B {
    --panel: #f0e2c2;
    --sunk: #e7d4ab;
    --btn: #f5ead0;
    --chipbg: #ead9b3;
    --ink: #33190f;
    --muted: #7a5638;

    --line-soft: #d6bb88;
    --accent: #8c2a20;
    --accent-edge: #5e1a13;
    --on-accent: #fbefd6;
    --gold: #c0912f;
    --gold-soft: #ecd08a;
    --icon: #8c2a20;
    --good: #56702d;
    --bad: #9b2b1e;
    --track: #dcc292;
    --link: #a77d3e;
    --crest: #8c2a20;
    --end: radial-gradient(circle at 45% 35%, #a8382b, #6c1d15 70%);
    --display: 'IM Fell English SC', Georgia, serif;
    --body: 'IM Fell English', Georgia, serif;

  .B .pane {
    background: linear-gradient(180deg, #f3e7ca, #ead7af);
    border: 1px solid var(--line);
    box-shadow:
      inset 0 0 0 3px #f3e7ca,
      inset 0 0 0 4px var(--gold),
      0 10px 24px rgba(60, 25, 10, 0.3);
  }
  .B .pane.corners {
    position: absolute;
  }
  .B .ribbon {
    position: relative;
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--display);
    font-size: 18px;
    padding: 5px 26px;
    letter-spacing: 0.06em;
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%, 12px 50%);
  }
  .B .top-band {
    left: 0;
    right: 0;
    top: 0;
    height: 58px;
    background: linear-gradient(#f3e7ca, #e5d0a3);

    box-shadow:
      0 3px 0 var(--accent),
      0 8px 20px rgba(60, 25, 10, 0.3);
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 0 20px 0 132px;
  }
  .B .crest {
    position: absolute;
    left: 30px;
    top: 0;
    width: 82px;
    height: 112px;
    border: 0;
    border-left: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
    background: linear-gradient(#9c3226, #6c1d15);
  }
  .B .crest svg {
    width: 40px;
    height: 40px;
    color: var(--gold-soft);
  }
  .B .civ {
    font-family: var(--display);
    font-size: 24px;
    letter-spacing: 0.04em;
  }
  .B .turn {
    margin-left: auto;
    font-family: var(--display);
    font-size: 19px;
  }
  .B .roundbtn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    background: var(--btn);
    color: var(--accent);
  }
  .B .res .r {
    font-size: 19px;
  }
  .B .trk .ico {

  .B .trk .ico svg {
    transform: rotate(-45deg);
  }
  .B .endturn {
    border-radius: 50%;
    background: var(--end);
    box-shadow:
      0 0 0 4px #7c2219,
      0 0 0 7px var(--gold),
      0 12px 26px rgba(60, 20, 10, 0.45);
    font-family: var(--display);
  }
  .B .endturn b {
    font-size: 27px;
  }
  .B .portrait {
    border-radius: 3px;
    border: 2px solid var(--gold);
  }
  .B .dlg > header {
    background: linear-gradient(#f3e7ca, #e8d4a8);
    border-bottom: 2px solid var(--gold);
  }
  .B .dlg {
    box-shadow:
      inset 0 0 0 6px var(--panel),
      inset 0 0 0 7px var(--gold);
  }
  .B .dropcap::first-letter {
    float: left;
    font-family: 'IM Fell English SC', serif;
    font-size: 64px;
    line-height: 0.8;

    color: var(--accent);

  .B .node {
    border-left: 4px solid var(--line);
  }
  .B .node.active {
    border-left-color: var(--gold);
  }
  .B .slot.hall {
    background: linear-gradient(#9c3226, #6c1d15);
  }
  .B .menu {
    background:
      linear-gradient(90deg, rgba(240, 226, 194, 0.98) 0 440px, rgba(240, 226, 194, 0.5)),
      url(img/map.jpg) center/cover;
  }
  .B .menu .left {
    box-shadow:
      inset -2px 0 0 var(--gold),
      inset -6px 0 0 #f0e2c2,
      inset -7px 0 0 var(--accent);
  }
  .B .ev {
    border: 1px solid var(--line);
  }
  .B .ev .seal {
    border-radius: 50%;
  }
  .B .choice .k {
    border-radius: 2px;
    transform: rotate(45deg);
  }
  .B .choice .k em {
    transform: rotate(-45deg);
    font-style: normal;
  }

        'Selected unit in a compact horizontal dock at the bottom centre',
        'Notifications as italic margin notes in the left margin',
        'A compass-rose End Turn; small caps labels, Spectral for running text',
      ],
    },
  };

  /* ---------- shared pieces ---------- */
  const res = () => `<div class="res">
  <span class="r num" title="Gold">${I('coin')}46 <span class="plus">+3</span></span>
  <span class="r num" title="Research">${I('flask')}12 <span class="plus">+4</span></span>
  <span class="r num" title="Culture">${I('lyre')}18 <span class="plus">+2</span></span>
  <span class="r num" title="People">${I('people')}4.1k</span>
  <span class="r num" title="Under arms">${I('swords')}600</span>
  <span class="r num" title="Cities">${I('tower')}2</span></div>`;
  const trkR = () =>
    `<div class="pane trk"><span class="ico">${I('flask')}</span><div class="t"><span class="label">Research</span><b>Bronze Working</b><div class="bar"><i style="width:62%"></i></div><div class="row"><span>34 / 55</span><span>4 turns</span></div></div></div>`;
  const trkC = () =>
    `<div class="pane trk"><span class="ico">${I('lyre')}</span><div class="t"><span class="label">Culture</span><b>Solar or Lunar Calendar</b><div class="bar"><i style="width:72%"></i></div><div class="row"><span>18 / 25</span><span>next choice in 3</span></div></div></div>`;
  const notes =
    () => `<div class="pane notes"><h4>${I('bell')}Notices <span class="muted" style="font-size:14px">(4)</span></h4><ul>
  <li>${I('flask')}Research complete: Mining</li>
  <li>${I('scroll')}The Veskari propose a non-aggression pact</li>
  <li>${I('house')}Corin: Granary finished</li>
  <li>${I('olive')}Envoys of the Oru have arrived</li></ul></div>`;
  const unit = compact => `<div class="pane unit">
  <div class="top"><span class="portrait"></span><div style="flex:1;min-width:0"><h3>1st Levy</h3><div class="sub">Aurelians · 500 people · 5/10 cohorts</div>
  <div class="row" style="margin-top:6px"><span class="chip num">${I('boot')}Moves 2/2</span><span class="chip">${I('wheat')}Grassland</span></div></div></div>
  ${compact ? '' : ''}
  <div class="stats num"><span title="Melee">${I('sword')}10</span><span title="Ranged">${I('bow')}0</span><span title="Charge">${I('charge')}0</span><span title="Armour">${I('shield')}0</span><span title="Morale">${I('flag')}30%</span><span title="Upkeep">${I('coin')}0</span></div>
  <div class="coh"><span class="n num">5×</span><div class="d"><b>Levy</b><br>No gear · infantry · melee 2 · moves 2</div><span class="step"><i>${I('minus')}</i><i>${I('plus')}</i></span></div>
  <div class="acts"><span class="ib on"><span>${I('anvil')}</span>Equip</span><span class="ib"><span>${I('split')}</span>Split</span><span class="ib"><span>${I('merge')}</span>Merge</span><span class="ib"><span>${I('road')}</span>Road</span><span class="ib"><span>${I('palisade')}</span>Fortify</span><span class="ib"><span>${I('target')}</span>Go to</span></div>
</div>`;
  const mini = () =>
    `<div class="pane mini"><div class="m"><i></i></div><div class="tools"><span>${I('layers')}</span><span>${I('zoomin')}</span><span>${I('zoomout')}</span></div></div>`;
  const endT = k =>
    `<div class="endturn">${k === 'C' ? `<svg class="rose" viewBox="0 0 24 24"><use href="#i-compass"/></svg>` : ''}<div><b>End<br>Turn</b><small>2 units await orders</small></div></div>`;

  /* ---------- HUD per proposal ---------- */
  const hud = {
    A: () => `<div class="map"></div>
  <div class="abs top-band"><span class="civ">Aurelians</span>${res()}<span class="turn num">Turn 12 <span class="muted">/ 400</span></span><span class="roundbtn">${I('scroll')}</span><span class="roundbtn">${I('menu')}</span></div>
  <div class="abs crest">${I('crown')}</div>
  <div class="abs col" style="left:118px;top:84px;gap:10px">${trkR()}${trkC()}</div>
  <div class="abs" style="right:20px;top:84px">${notes()}</div>
  <div class="abs" style="left:20px;bottom:20px">${mini()}</div>
  <div class="abs" style="right:196px;bottom:20px">${unit()}</div>
  <div class="abs" style="right:28px;bottom:34px">${endT('A')}</div>`,
    B: () => `<div class="map"></div>
  <div class="abs top-band"><span class="civ">The Aurelians</span>${res()}<span class="turn num">Turn 12 of 400</span><span class="roundbtn">${I('scroll')}</span><span class="roundbtn">${I('menu')}</span></div>
  <div class="abs crest">${I('crown')}</div>
  <div class="abs col" style="left:20px;top:132px;gap:12px">${unit()}</div>
  <div class="abs col" style="right:20px;top:78px;gap:10px;align-items:flex-end">${trkR()}${trkC()}</div>
  <div class="abs" style="right:20px;top:300px">${notes()}</div>
  <div class="abs" style="left:20px;bottom:20px">${mini()}</div>
  <div class="abs" style="right:36px;bottom:36px">${endT('B')}</div>`,
    C: () => `<div class="map"></div>
  <div class="abs top-band"><span class="crest">${I('crown')}</span><span class="civ">Aurelians</span><span class="sep"></span>${res()}<span class="sep"></span>
    <span class="inline-trk">${I('flask')}Bronze Working <span class="bar"><i style="width:62%"></i></span><span class="muted num">4</span></span>
    <span class="inline-trk">${I('lyre')}Calendar <span class="bar"><i style="width:72%"></i></span><span class="muted num">3</span></span>
    <span class="turn num">Turn 12 · 400</span><span class="roundbtn">${I('menu')}</span></div>
  <div class="abs col" style="left:18px;top:96px;gap:10px">
    <div class="margin-note"><b>Research</b>Mining is learned. Copper and tin now show on the map.</div>
    <div class="margin-note"><b>Veskari</b>They propose a pact of non-aggression.</div>
    <div class="margin-note"><b>Corin</b>The granary is finished.</div>
    <div class="margin-note"><b>Oru</b>Envoys of the free people have arrived.</div></div>
  <div class="abs" style="right:18px;top:84px">${mini()}</div>
  <div class="abs dock">${unit(true)}</div>
  <div class="abs" style="right:34px;bottom:30px">${endT('C')}</div>`,
  };

  /* ---------- dialogs (shared markup, themed by the proposal) ---------- */
  const head = (t, sub, k) =>
    `<header>${k === 'A' ? `<svg class="laurel"><use href="#i-laurel"/></svg>` : ''}${k === 'B' ? `<span class="ribbon">${t}</span>` : `<h2>${t}</h2>`}<span class="muted">${sub}</span><span class="sp"></span><span class="x">${I('x')}</span></header>`;
  const city =
    k => `<div class="dlg city">${head('Corin', 'Capital · founded turn 1 · 2,300 people', k)}
 <div class="body">
  <div class="col" style="gap:12px">
   <div class="cityhead"></div>
   <div class="tabs2"><span class="on">Districts</span><span>Store</span><span>Troops</span></div>
   <div class="yields num">
    <div><span class="label">Food</span><b>${I('wheat')}+4</b></div><div><span class="label">Production</span><b>${I('hammer')}6</b></div>
    <div><span class="label">Housing</span><b>${I('house')}2.3k/3k</b></div><div><span class="label">Workers</span><b>${I('people')}800/1.5k</b></div></div>
   <div class="stock"><span class="chip num">Wood 10</span><span class="chip num">Hides 4</span><span class="chip num">Stone 4</span><span class="chip num">Grain 6</span></div>
  </div>
  <div class="col" style="gap:10px">
   <div class="row" style="justify-content:space-between"><span class="label">Corin centre · 3×3 district</span><span class="muted" style="font-size:14px">6 of 9 slots used</span></div>
   <div class="dgrid" style="width:370px">
    <div class="slot"><span>${I('house')}</span><div><b>Granary</b><div class="tag">+1 food to neighbours</div></div></div>
    <div class="slot"><span>${I('wheat')}</span><div><b>Pig pen</b><div class="tag">+2 food · next to grain</div></div></div>
    <div class="slot"><span>${I('wheat')}</span><div><b>Grain field</b><div class="tag">+3 food</div></div></div>
    <div class="slot"><span>${I('house')}</span><div><b>Houses</b><div class="tag">+1,000 housing</div></div></div>
    <div class="slot hall"><span>${I('tower')}</span><div><b>Town hall</b><div class="tag">Seat of the city</div></div></div>
    <div class="slot sel"><span>${I('hammer')}</span><div><b>Woodlot</b><div class="tag">Building · 3 turns</div><div class="bar" style="margin-top:4px"><i style="width:40%"></i></div></div></div>
    <div class="slot empty">${I('plus')}<span>Empty</span></div>
    <div class="slot"><span>${I('swords')}</span><div><b>Barracks</b><div class="tag">Queued</div></div></div>
    <div class="slot empty">${I('plus')}<span>Empty</span></div>
   </div>
  </div>
  <div class="side">
   <span class="label">Selected slot</span><h3>Woodlot</h3>
   <div class="muted" style="font-size:15px">Forestry · needs forest in reach</div>
   <ul><li>+2 wood a turn</li><li>Uses 200 workers</li><li>40% built, 3 turns at 6 production</li></ul>
   <div class="col" style="gap:8px;margin-top:auto">
    <span class="btn">${I('scroll')}Save as blueprint</span>
    <span class="btn primary">${I('flag')}Raise levy · 500 people</span>
    <span class="btn">${I('people')}Send settlers · 1,000</span></div>
  </div>
 </div></div>`;

  const nodes = [
    // x,y,name,state,sub,icon
    [10, 20, 'Mining', 'done', 'Learned', 'hammer'],
    [10, 110, 'Pottery', 'done', 'Learned', 'house'],
    [10, 200, 'Writing', 'done', 'Learned', 'quill'],
    [10, 290, 'Mysticism', '', '12 research', 'sun'],
    [260, 20, 'Bronze Working', 'active', '4 turns · researching', 'anvil'],
    [260, 110, 'Irrigation', '', '20 research', 'drop'],
    [260, 200, 'Currency', '', '45 research', 'coin'],
    [260, 290, 'Literature', '', '55 research', 'scroll'],
    [510, 0, 'Iron Working', 'locked', 'Needs Bronze Working', 'lock'],
    [510, 70, 'Carpentry', 'locked', 'Needs Bronze Working', 'lock'],
    [510, 140, 'Drill', 'locked', 'Needs Bronze Working', 'lock'],
    [510, 240, 'Mathematics', '', '55 research', 'target'],
    [510, 320, 'Philosophy', '', '75 research', 'eye'],
  ];
  const links = [
    [0, 4],
    [4, 8],
    [4, 9],
    [4, 10],
    [1, 5],
    [2, 6],
    [2, 7],
    [2, 11],
    [2, 12],
    [3, 12],
  ];
  const research =
    k => `<div class="dlg research">${head('Research', '12 research a turn · 9 of 57 learned', k)}
 <div class="body">
  <div class="col" style="gap:14px;min-width:0">
   <div class="tabs2"><span class="on">Ancient</span><span>Classical</span><span>Medieval</span><span>Renaissance</span></div>
   <div class="tree" style="height:390px">
    <svg class="links" viewBox="0 0 720 390" preserveAspectRatio="none">${links
      .map(([a, b]) => {
        const A = nodes[a],
          B = nodes[b];
        const x1 = A[0] + 196,
          y1 = A[1] + 26,
          x2 = B[0],
          y2 = B[1] + 26,
          m = (x1 + x2) / 2;
        return `<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/>`;
      })
      .join('')}</svg>
    ${nodes.map(n => `<div class="node ${n[3]}" style="left:${n[0]}px;top:${n[1]}px"><span class="ni">${I(n[3] === 'done' ? 'check' : n[5])}</span><div><b>${n[2]}</b><small>${n[4]}</small></div></div>`).join('')}
   </div>
  </div>
  <div class="side">
   <span class="label">Researching</span><h3>Bronze Working</h3>
   <div class="bar"><i style="width:62%"></i></div><div class="row muted num" style="justify-content:space-between;font-size:14px"><span>34 / 55</span><span>4 turns</span></div>
   <span class="label" style="margin-top:6px">Unlocks</span>
   <ul><li>Bronze spear, bronze shield and helmet</li><li>Copper and tin mines</li><li>Leads to Iron Working, Carpentry, Drill</li></ul>
   <div class="muted" style="font-size:14px">10% cheaper: your culture leans to Martial.</div>
   <div class="col" style="gap:8px;margin-top:auto"><span class="btn primary">${I('target')}Set Iron Working as goal</span></div>
  </div>
 </div></div>`;

  const peoples =
    k => `<div class="dlg peoples">${head('Peoples', 'Your army strength 34 · score 41', k)}
 <div class="body">
  <div class="plist">
   <span class="label">Great peoples</span>
   <div class="p"><span class="sw" style="background:#2a5fb0"></span><div><b>Veskari</b><small>3 cities · pact, 18 turns left</small></div><span class="sp"></span><span class="pill good num">Warm +22</span></div>
   <div class="p"><span class="sw" style="background:#2f8a3c"></span><div><b>Tolhuan</b><small>2 cities · trading partners</small></div><span class="sp"></span><span class="pill mid num">Wary +3</span></div>
   <div class="p"><span class="sw" style="background:#c78a1e"></span><div><b>Maru</b><small>4 cities · crowded borders</small></div><span class="sp"></span><span class="pill bad num">Cold −24</span></div>
   <span class="label" style="margin-top:8px">Free peoples</span>
   <div class="p sel"><span class="sw free" style="background:#6f8483"></span><div><b>Oru</b><small>Oruvel · 3 gold + 2 fish a turn</small></div><span class="sp"></span><span class="pill ally">Allies</span></div>
   <div class="p"><span class="sw free" style="background:#8c7b62"></span><div><b>Tarsi</b><small>Tarsa · 1 gold a turn</small></div><span class="sp"></span><span class="pill good">Friends</span></div>
   <div class="p"><span class="sw free" style="background:#7f7466"></span><div><b>Belkan</b><small>Belk · stone</small></div><span class="sp"></span><span class="pill mid">Wary</span></div>
  </div>
  <div class="detail">
   <div class="row" style="gap:14px"><span class="sw free" style="background:#6f8483;width:44px;height:44px"></span><div><h3 class="h" style="margin:0;font-size:26px;font-weight:600">The Oru</h3><div class="muted">Free city of Oruvel · 1,900 people · garrison of 4 cohorts · known for fish</div></div></div>
   <div class="ladder">
    <div><b>Wary</b>Gifts and envoys win them over</div>
    <div><b>Friends</b>Opinion 30+ · 1 gold a turn</div>
    <div class="now"><b>Allies</b>3 gold + 2 fish a turn, they fight at your side</div>
    <div><b>Absorbed</b>Their city and troops become yours</div>
   </div>
   <div class="ops">
    <div class="box"><h5>Why they like you <span class="muted num" style="font-weight:400">+48</span></h5>
     <div class="reason"><span>Allies</span><span class="plus num">+25</span></div>
     <div class="reason"><span>Sent us gifts</span><span class="plus num">+21</span></div>
     <div class="reason"><span>Received our envoys with honour</span><span class="plus num">+12</span></div>
     <div class="reason"><span>Crowded borders</span><span class="minus num">−10</span></div></div>
    <div class="box"><h5>Absorb the Oru</h5>
     <div class="req ok">${I('check')}Allies</div>
     <div class="req no">${I('lock')}Alliance 6 of 10 turns</div>
     <div class="req no">${I('lock')}Opinion 48 of 60</div>
     <div class="req no">${I('lock')}260 gold (you have 46)</div>
     <div class="muted" style="font-size:13px">1 in 5 of their people will leave, and the other free peoples will distrust you. The alliance already pays tribute for nothing.</div></div>
   </div>
   <div class="row muted" style="gap:8px;font-size:14px">${I('coin')}This turn the Oru sent 3 gold and 2 fish to Corin. Their garrison marches with you in any war.</div>
   <div class="row" style="gap:10px;margin-top:auto"><span class="btn primary">${I('gift')}Send a gift · 25 gold</span><span class="btn" disabled>${I('crown')}Absorb · 260 gold</span><span class="sp" style="flex:1"></span><span class="btn ghost" style="color:var(--bad)">${I('swords')}Declare war</span></div>
  </div>
 </div></div>`;

  const event = k => `<div class="map"></div><div class="event"><div class="pane ev">
  <div class="art"><span class="seal">${I('olive')}</span></div>
  <div class="in">
   <span class="label eyebrow">History · Turn 14 · The Oru</span>
   <h2>Envoys of a Free People</h2>
   <p class="dropcap">Elders of the Oru have come under a green branch to see what kind of people we are. They have brought dried fish and a carved oar, and they ask to be heard in the hall at Corin.</p>
   <div class="choice hot"><span class="k"><em>1</em></span><div><b>Receive them with gifts</b><small>−15 gold · the Oru warm to you (+20)</small></div></div>
   <div class="choice"><span class="k"><em>2</em></span><div><b>Hear them out, and nothing more</b><small>The Oru think a little better of you (+6)</small></div></div>
  </div></div></div>`;

  const menu = k => `<div class="menu">
  <div class="left">
   ${k === 'A' ? `<svg class="laurel" style="width:70px;height:35px"><use href="#i-laurel"/></svg>` : ''}
   <h1 class="title">History<br>Unfolded</h1>
   <div class="tag">Every people starts the same. What they become is up to you.</div>
   <div class="mbtn primary">Continue<small>Aurelians · turn 12</small></div>
   <div class="mbtn">New game ${I('right')}</div>
   <div class="mbtn">Load game</div>
   <div class="mbtn">Settings</div>
   <div class="mbtn">Quit</div>
  </div>
  <div class="pane setup">
   ${k === 'B' ? `<span class="ribbon" style="align-self:flex-start">A New World</span>` : `<h3>A new world</h3>`}
   <span class="label">Map type</span>
   <div class="maps">
    <div class="on"><b>Continents</b>2–4 large landmasses split by ocean</div><div><b>Pangaea</b>One great landmass</div><div><b>Archipelago</b>Many islands, ships matter</div>
    <div><b>Inland Sea</b>Land ringed round a sea</div><div><b>Highlands</b>Mountains and valleys</div><div><b>Random</b>Any of these</div></div>
   <div class="row" style="gap:16px;align-items:flex-end">
    <div class="field"><span class="label">Size</span><div class="seg"><span>Small</span><span class="on">Standard</span><span>Large</span><span>Huge</span></div></div>
    <div class="field" style="flex:.6"><span class="label">Great peoples</span><div class="seg"><span>6</span><span class="on">8</span><span>10</span></div></div></div>
   <div class="row" style="gap:16px;align-items:flex-end">
    <div class="field"><span class="label">Your people</span><div class="input">Aurelians</div></div>
    <div class="field"><span class="label">Free peoples</span><div class="input num">7</div></div>
    <div class="field"><span class="label">Seed</span><div class="input num">48213</div></div></div>
   <div class="row" style="gap:12px;align-items:flex-end"><div class="field"><span class="label">Sea level</span><div class="seg"><span>Low</span><span class="on">Normal</span><span>High</span></div></div><div class="field"><span class="label">Climate</span><div class="seg"><span>Low</span><span class="on">Normal</span><span>High</span></div></div><div class="field"><span class="label">Rainfall</span><div class="seg"><span>Low</span><span>Normal</span><span class="on">High</span></div></div><div class="field"><span class="label">Resources</span><div class="seg"><span>Low</span><span class="on">Normal</span><span>High</span></div></div><div class="field"><span class="label">Mountains</span><div class="seg"><span class="on">Low</span><span>Normal</span><span>High</span></div></div></div>
   <div class="row" style="justify-content:space-between;gap:10px;margin-top:auto"><span class="muted" style="font-size:14px">Game ends with a score victory on turn 400, or when one great people remains.</span><span class="sp" style="flex:1"></span><span class="btn primary">Begin ${I('right')}</span></div>
  </div></div>`;

  /* ---------- page ---------- */
  const S = (w, h, inner, k) =>
    `<div class="stage" style="aspect-ratio:${w}/${h}"><div class="cv ${k}" data-w="${w}" style="width:${w}px;height:${h}px">${inner}</div></div>`;
  function render(k) {
    const p = P[k];
    document.getElementById('view').innerHTML = `
 <section class="col" style="gap:28px">
  <div class="pitch"><h2>${k} · ${p.name}</h2><p>${p.pitch}</p><ul>${p.points.map(x => `<li>${x}</li>`).join('')}</ul></div>
  <div><p class="cap">Main view</p>${S(1600, 900, hud[k](), k)}</div>
  <div class="grid2">
   <div><p class="cap">City</p>${S(1100, 640, city(k), k)}</div>
   <div><p class="cap">Research</p>${S(1100, 640, research(k), k)}</div>
   <div><p class="cap">Peoples and free peoples</p>${S(1100, 640, peoples(k), k)}</div>
   <div><p class="cap">History event</p>${S(1100, 640, event(k), k)}</div>
  </div>
  <div><p class="cap">Main menu and new game</p>${S(1400, 720, `<div class="map"></div>` + menu(k), k)}</div>
 </section>`;
    fit();
  }
  function fit() {
    document.querySelectorAll('.stage').forEach(s => {
      const c = s.firstElementChild;
      c.style.transform = `scale(${s.clientWidth / c.dataset.w})`;
    });
  }
  new ResizeObserver(fit).observe(document.body);
  let cur = 'A';
  try {
    const h = location.hash.slice(1).toUpperCase();
    if (P[h]) cur = h;
  } catch (e) {}
  document.querySelectorAll('.tab').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.k === cur);
    b.onclick = () => {
      cur = b.dataset.k;
      document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
      try {
        history.replaceState(null, '', '#' + cur.toLowerCase());
      } catch (e) {
        location.hash = cur.toLowerCase();
      }
      render(cur);
    };
  });
  render(cur);
</script>
