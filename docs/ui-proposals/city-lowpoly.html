<title>Corin City View</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: full-screen isometric diorama; Ivory Codex panels float over it (header left, inspector right, tools bottom). */
:root{
  --panel:#f7f1e3;--sunk:#efe6d1;--btn:#fbf7ee;--ink:#2a2419;--muted:#76674d;--line:#c9b083;--line-soft:#e0d2b4;
  --accent:#2f6a60;--accent-edge:#1f4c45;--on-accent:#fbf7ee;--gold:#b8924a;--gold-soft:#e7d6ac;--icon:#9a7a3b;
  --sky1:#f4ecd9;--sky2:#e6d7b6;
  --display:"Cinzel",Georgia,serif;--body:"EB Garamond",Georgia,serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky1);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
#scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,var(--sky1),var(--sky2))}
#scene canvas{display:block}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line-soft),0 8px 22px rgba(70,50,20,.22)}
.label{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.03em}
.ui{position:fixed;z-index:2}
#head{left:max(18px,env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));width:300px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
#head .crumb{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
#head .crumb a{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--gold-soft)}
#head h1{font-size:28px}
#head .sub{color:var(--muted);font-size:15px;margin-top:-4px}
.dlist{display:flex;flex-direction:column;gap:5px}
.dl{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line-soft);border-radius:8px;background:var(--btn);cursor:pointer;font:inherit;color:inherit;text-align:left}
.dl:hover{border-color:var(--gold)}
.dl.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent-edge)}
.dl.on small{color:var(--on-accent);opacity:.8}
.dl b{font-family:var(--display);font-weight:600;font-size:15px;display:block}
.dl small{font-size:13px;color:var(--muted)}
.dl .n{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
.dl:focus-visible,.btn:focus-visible,.pk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slot-cap{display:flex;gap:4px;align-items:center}
.slot-cap i{width:9px;height:9px;border-radius:2px;display:inline-block}
#insp{right:max(18px,env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:340px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#insp .grp{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
#insp .grp i{width:10px;height:10px;border-radius:3px}
#insp h2{font-size:24px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:200px}
.mini3 span{aspect-ratio:1;border-radius:5px;border:1px solid var(--line-soft);background:var(--sunk);font-size:11px;line-height:1.1;display:grid;place-items:center;text-align:center;padding:3px;cursor:pointer;color:var(--ink)}
.mini3 span.sel{box-shadow:0 0 0 2px var(--gold);background:var(--btn)}
.picker{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.pg h4{margin:0 0 5px;font:600 12.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pg h4 i{width:9px;height:9px;border-radius:2px}
.pg div{display:flex;flex-wrap:wrap;gap:5px}
.pk{font:inherit;font-size:14px;padding:4px 9px;border-radius:999px;border:1px solid var(--line-soft);background:var(--btn);cursor:pointer;color:var(--ink)}
.pk:hover{border-color:var(--gold)}
.pk.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent-edge)}
#tools{left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:10px 12px;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:14.5px;letter-spacing:.04em;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-edge)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.tag{position:fixed;z-index:1;transform:translate(-50%,-100%);pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px 5px;text-align:center;box-shadow:0 4px 12px rgba(70,50,20,.2);white-space:nowrap}
.tag b{font-family:var(--display);font-weight:600;font-size:14px;display:block}
.tag small{font-size:12px;color:var(--muted)}
#tip{position:fixed;z-index:3;pointer-events:none;background:var(--ink);color:var(--panel);font-size:14px;padding:4px 9px;border-radius:6px;transform:translate(12px,12px);white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--muted);letter-spacing:.1em;z-index:0}
@media (max-width:1100px){#insp{width:290px}#head{width:260px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="loading">Raising Corin…</div>
<div id="scene"></div>

<div class="ui pane" id="head">
  <div class="crumb" id="crumb"></div>
  <div><h1 id="title">Corin</h1><div class="sub" id="sub"></div></div>
  <span class="label" id="dlabel">Districts</span>
  <div class="dlist" id="dlist"></div>
</div>

<div class="ui pane" id="insp"></div>

<div class="ui pane" id="tools">
  <button class="btn" id="back" disabled><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>City view</button>
  <button class="btn" id="rotL" title="Rotate left"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5M5 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button class="btn" id="rotR" title="Rotate right"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2-5M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button class="btn" id="zin" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 20 20M10.5 7.5v6M7.5 10.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="btn" id="zout" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 20 20M7.5 10.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="btn primary" id="next">Next district<svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>
<div id="tip" hidden></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ------------------------------------------------------------------ game data (from src/data/slots.ts) */
const GROUPS={farming:['Farming','#9bb54a'],forestry:['Forestry','#4f7a3a'],extraction:['Extraction','#8a6b4e'],craft:['Craft & industry','#b0663a'],services:['Services','#5a86a8'],commerce:['Commerce & finance','#c9962b'],residential:['Residential','#b5838d'],civic:['Civic','#6b4a8a']};
const SLOTS=Object.fromEntries(`town-hall|Town hall|civic grain-field|Grain field|farming pig-pen|Pig pen|farming cattle-pasture|Cattle pasture|farming sheep-run|Sheep run|farming horse-stud|Horse stud|farming fishing-dock|Fishing dock|farming granary|Granary|farming windmill|Windmill|farming woodlot|Woodlot|forestry lumber-mill|Lumber mill|forestry quarry|Quarry|extraction copper-mine|Copper mine|extraction tin-mine|Tin mine|extraction iron-mine|Iron mine|extraction coal-mine|Coal mine|extraction gold-mine|Gold mine|extraction silver-mine|Silver mine|extraction hunting-lodge|Hunting lodge|extraction plantation|Plantation|extraction saltpeter-works|Saltpeter works|extraction workshop|Workshop|craft armoury|Armoury|craft barracks|Barracks|craft shipyard|Shipyard|craft foundry|Foundry|craft infirmary|Infirmary|services school|School|services library|Library|services university|University|services printing-house|Printing house|services observatory|Observatory|services market|Market|commerce bank|Bank|commerce stock-exchange|Stock exchange|commerce harbour|Harbour|commerce guild-hall|Guild hall|commerce houses|Houses|residential aqueduct|Aqueduct|residential tenements|Tenements|residential shrine|Shrine|civic monument|Monument|civic walls|City walls|civic temple|Temple|civic amphitheatre|Amphitheatre|civic cathedral|Cathedral|civic castle|Castle|civic`.split(/ (?=[a-z-]+\|[A-Z])/).map(s=>{const [id,name,g]=s.split('|');return [id,{name,g}]}));

/* An example capital at its full size: six districts. */
const DISTRICTS=[
 {name:'Corin centre',note:'City centre',slots:['granary','houses','market','houses','town-hall','temple','workshop','barracks','houses']},
 {name:'Riverside Farms',note:'Farming',slots:['grain-field','grain-field','windmill','pig-pen','granary','cattle-pasture','grain-field','sheep-run','houses']},
 {name:'Northern Mine',note:'Extraction',slots:['iron-mine','copper-mine','quarry','foundry','infirmary','armoury','houses','coal-mine',null]},
 {name:'Oakwood',note:'Forestry',slots:['woodlot','woodlot','lumber-mill','hunting-lodge','woodlot','houses','woodlot','workshop',null]},
 {name:'Harbour Quarter',note:'Sea trade',slots:['fishing-dock','harbour','shipyard','market','guild-hall','houses','tenements','bank','aqueduct']},
 {name:'Scholars\' Hill',note:'Learning',slots:['library','university','observatory','school','cathedral','printing-house','amphitheatre','monument','castle']},
];
const POP=[2300,1500,1400,900,2100,1200];

/* ------------------------------------------------------------------ three setup */
const host=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
document.getElementById('loading').remove();
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-200,400);
scene.add(new THREE.HemisphereLight(0xfff6e2,0x8a7a5a,1.15));
const sun=new THREE.DirectionalLight(0xfff1d6,2.1);
sun.position.set(-9,16,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);

const mats={};
const M=(c,o={})=>mats[c+JSON.stringify(o)]||(mats[c+JSON.stringify(o)]=new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.92,metalness:0,...o}));
function add(g,geo,c,x=0,y=0,z=0,o){const m=new THREE.Mesh(geo,M(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
const box=(g,w,h,d,c,x=0,y=0,z=0)=>add(g,new THREE.BoxGeometry(w,h,d),c,x,y+h/2,z);
const cyl=(g,r1,r2,h,c,x=0,y=0,z=0,seg=7)=>add(g,new THREE.CylinderGeometry(r1,r2,h,seg),c,x,y+h/2,z);
const cone=(g,r,h,c,x=0,y=0,z=0,seg=6)=>add(g,new THREE.ConeGeometry(r,h,seg),c,x,y+h/2,z);
const ball=(g,r,c,x=0,y=0,z=0)=>add(g,new THREE.IcosahedronGeometry(r,0),c,x,y,z);
function prism(w,h,d){const s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(0,h);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);return g}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* palette */
const C={grass:'#a7b86f',grass2:'#94a95e',meadow:'#b6c47c',earth:'#b79e70',dirt:'#a68a5c',paved:'#cfc3a8',stone:'#c9c0ad',stone2:'#aaa08c',dark:'#6f675a',wall:'#efe4cc',wall2:'#e2d2b0',timber:'#7d5a36',wood:'#946b40',roof:'#b5583b',roof2:'#9c4a33',teal:'#2f6a60',gold:'#c79a3e',water:'#6f9fb0',water2:'#5d8ea3',leaf:'#6f8f45',leaf2:'#5b7b3a',pine:'#4f6e3c',wheat:'#d8b75a',wheat2:'#c9a447',white:'#f4efe3',pink:'#e0a59a',brown:'#7a5233',black:'#3a3530',slab:'#8c7a58',slabTop:'#a89268'};

/* small kit */
function house(g,x,z,w,d,h,{wall=C.wall,roof=C.roof,rot=0,roofH=.16}={}){const p=new THREE.Group();p.position.set(x,0,z);p.rotation.y=rot;g.add(p);box(p,w,h,d,wall);const r=add(p,prism(w+.05,roofH,d+.05),roof,0,h,0);return p}
function tree(g,x,z,s=1,kind='leaf',r=Math.random){cyl(g,.022*s,.03*s,.12*s,C.timber,x,0,z,5);if(kind==='pine'){cone(g,.11*s,.22*s,C.pine,x,.08*s,z,6);cone(g,.08*s,.18*s,C.pine,x,.2*s,z,6)}else ball(g,.12*s,r()<.5?C.leaf:C.leaf2,x,.2*s,z)}
function rock(g,x,z,s,c=C.stone2){const m=add(g,new THREE.DodecahedronGeometry(s,0),c,x,s*.45,z);m.scale.y=.7;m.rotation.y=x*7}
function fence(g,pts,c=C.wood){for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz);const n=Math.max(2,Math.round(L/.14));for(let k=0;k<=n;k++)box(g,.022,.08,.022,c,a[0]+dx*k/n,0,a[1]+dz*k/n);const rail=box(g,L,.014,.014,c,(a[0]+b[0])/2,.055,(a[1]+b[1])/2);rail.rotation.y=-Math.atan2(dz,dx)}}
function animal(g,x,z,c,s=1,rot=0,head=C.black){const p=new THREE.Group();p.position.set(x,0,z);p.rotation.y=rot;g.add(p);box(p,.12*s,.06*s,.06*s,c,0,.035*s,0);box(p,.045*s,.045*s,.045*s,head,.07*s,.06*s,0);for(const[a,b]of[[-.04,-.02],[-.04,.02],[.04,-.02],[.04,.02]])box(p,.012*s,.035*s,.012*s,head,a*s,0,b*s)}
function sheep(g,x,z){ball(g,.045,C.white,x,.05,z);box(g,.025,.03,.025,C.black,x+.045,.055,z)}
function water(g,x,z,w,d){box(g,w,.02,d,C.water,x,-.005,z)}
function boat(g,x,z,rot=0,s=1){const p=new THREE.Group();p.position.set(x,.015,z);p.rotation.y=rot;g.add(p);const h=add(p,prism(.08*s,.05*s,.26*s),C.wood);h.rotation.z=Math.PI;h.position.y=.05*s;box(p,.012,.2*s,.012,C.timber,0,.05*s,0);const sail=add(p,new THREE.PlaneGeometry(.1*s,.12*s),C.white,0,.17*s,0,{side:THREE.DoubleSide})}
function columns(g,x,z,w,d,h,n){for(let i=0;i<n;i++){const t=n===1?0:i/(n-1);cyl(g,.022,.022,h,C.white,x-w/2+t*w,0,z+d/2,7)}}
function chimney(g,x,y,z,h=.14,c=C.stone2){box(g,.05,h,.05,c,x,y,z);ball(g,.04,'#d9d2c4',x,y+h+.05,z).scale.set(1,.7,1);ball(g,.03,'#e6e0d4',x+.03,y+h+.11,z-.02)}
function flag(g,x,y,z,c=C.teal,h=.26){cyl(g,.007,.007,h,C.timber,x,y,z,4);add(g,new THREE.PlaneGeometry(.1,.06),c,x+.05,y+h-.04,z,{side:THREE.DoubleSide})}
function pile(g,x,z,c,n=5,r=Math.random){for(let i=0;i<n;i++)rock(g,x+(r()-.5)*.12,z+(r()-.5)*.12,.03+r()*.02,c)}
function mineMound(g,ore,r){const m=add(g,new THREE.DodecahedronGeometry(.36,0),C.stone2,-.08,.02,-.12);m.scale.set(1.1,.62,.9);rock(g,.2,-.25,.1,C.dark);box(g,.14,.13,.06,C.black,-.02,0,.16);box(g,.18,.03,.08,C.timber,-.02,.13,.17);box(g,.025,.13,.025,C.timber,-.09,0,.18);box(g,.025,.13,.025,C.timber,.05,0,.18);for(let i=0;i<4;i++)box(g,.03,.01,.12,C.timber,-.02,0,.26+i*.06);box(g,.1,.06,.07,C.dark,.2,.0,.32);pile(g,.2,.36,ore,4,r);pile(g,-.3,.3,ore,6,r)}

/* ------------------------------------------------------------------ one builder per building */
const B={
 'town-hall':(g,r)=>{box(g,.62,.05,.62,C.stone,0,0,0);box(g,.42,.24,.36,C.wall);add(g,new THREE.ConeGeometry(.33,.2,4),C.teal,0,.34,0).rotation.y=Math.PI/4;box(g,.12,.16,.12,C.wall2,0,.24,0);add(g,new THREE.ConeGeometry(.1,.14,4),C.teal,0,.47,0).rotation.y=Math.PI/4;flag(g,0,.54,0,C.roof);columns(g,0,.0,.3,.36,.18,4);return C.paved},
 'grain-field':(g,r)=>{for(let i=0;i<6;i++)box(g,.9,.05+r()*.02,.1,i%2?C.wheat:C.wheat2,0,0,-.38+i*.15);cyl(g,.008,.008,.2,C.timber,.3,0,.0,4);box(g,.12,.012,.012,C.timber,.3,.15,.0);ball(g,.025,C.wheat2,.3,.2,0);return C.earth},
 'pig-pen':(g,r)=>{box(g,.5,.012,.42,'#8a6c48',-.05,0,.05);fence(g,[[-.32,-.18],[.22,-.18],[.22,.28],[-.32,.28],[-.32,-.18]]);house(g,.3,-.3,.22,.18,.1,{roof:C.wood,rot:.2});for(let i=0;i<3;i++)animal(g,-.2+i*.15,(r()-.3)*.3,C.pink,.85,r()*6,'#c98b80');return C.grass2},
 'cattle-pasture':(g,r)=>{fence(g,[[-.42,-.42],[.42,-.42],[.42,.42],[-.42,.42],[-.42,-.42]]);for(let i=0;i<4;i++)animal(g,-.25+r()*.5,-.25+r()*.5,r()<.5?C.brown:C.white,1.2,r()*6,C.black);tree(g,.3,-.28,.9,'leaf',r);return C.meadow},
 'sheep-run':(g,r)=>{for(const[a,b,c,d]of[[-.44,-.44,.88,.06],[-.44,.38,.88,.06]])box(g,c,.06,d,C.stone2,a+c/2,0,b+d/2);for(let i=0;i<6;i++)sheep(g,-.3+r()*.6,-.3+r()*.6);rock(g,.28,.2,.06);return C.meadow},
 'horse-stud':(g,r)=>{house(g,-.22,-.24,.42,.2,.14,{roof:C.roof2});fence(g,[[-.42,.04],[.42,.04],[.42,.42],[-.42,.42],[-.42,.04]]);animal(g,-.1,.22,C.brown,1.4,.4,'#5a3b24');animal(g,.2,.26,'#c2a07a',1.4,2.6,'#5a3b24');return C.meadow},
 'fishing-dock':(g,r)=>{water(g,0,.18,1,.64);box(g,.1,.04,.6,C.wood,.05,0,.12);for(let i=0;i<5;i++)box(g,.02,.08,.02,C.timber,.0+(i%2)*.1,-.04,-.14+i*.13);boat(g,-.22,.2,.3);boat(g,.3,.28,-.4,.8);house(g,-.2,-.34,.24,.16,.12,{roof:C.wood});box(g,.12,.05,.06,'#9fb7bf',.25,0,-.32);return C.earth},
 'granary':(g,r)=>{for(const[x,z]of[[-.16,-.06],[.18,.06]]){cyl(g,.15,.15,.26,C.wall2,x,0,z,9);cone(g,.19,.14,C.roof,x,.26,z,9)}box(g,.2,.12,.16,C.wall,.0,0,.3);pile(g,-.3,.3,C.wheat,4,r);return C.dirt},
 'windmill':(g,r)=>{cyl(g,.11,.17,.42,C.wall,0,0,0,8);cone(g,.15,.16,C.roof,0,.42,0,8);const hub=new THREE.Group();hub.position.set(0,.4,.17);g.add(hub);for(let i=0;i<4;i++){const s=box(hub,.05,.32,.008,C.white,0,0,0);s.position.y=0;s.geometry.translate(0,.16,0);s.rotation.z=i*Math.PI/2+.3}hub.userData.spin=1;for(let i=0;i<3;i++)box(g,.9,.04,.1,C.wheat,0,0,-.4+i*.1+(i>1?.6:0));return C.earth},

/* ------------------------------------------------------------------ tiles and districts */
const TILE=1, GAP=.06, PITCH=TILE+GAP;
const tiles=[]; // pickable tops
function buildTile(type,seed){
  const g=new THREE.Group();const r=rng(seed);
  const ground=(B[type]||B.empty)(g,r)||C.grass;
  const top=add(g,new THREE.BoxGeometry(TILE,.06,TILE),ground,0,-.03,0);top.castShadow=false;
  add(g,new THREE.BoxGeometry(TILE,.1,TILE),C.slab,0,-.11,0).castShadow=false;
  g.userData.top=top;
  return g;
}
const districtGroups=[];
// a hex-like ring: the centre, then five around it
const RING=[[0,0],[4.3,-1.2],[2.2,3.9],[-2.6,3.7],[-4.4,-.9],[-.6,-4.4]];
const ground=add(scene,new THREE.CylinderGeometry(11.5,12,.3,24),'#b9a97c',0,-.48,0);ground.castShadow=false;
const ground2=add(scene,new THREE.CylinderGeometry(10.6,11.3,.12,24),'#a9b878',0,-.22,0);ground2.castShadow=false;
// roads from the centre to each district
RING.slice(1).forEach(([x,z])=>{const L=Math.hypot(x,z)-2.1,ang=Math.atan2(z,x);const road=add(scene,new THREE.BoxGeometry(L,.03,.28),'#cdbb92',(x/Math.hypot(x,z))*(1.75+L/2)*0+x/2,-.15,z/2);road.rotation.y=-ang;road.castShadow=false});
// low-poly scenery around: trees and rocks between districts
{const r=rng(99);for(let i=0;i<110;i++){const a=r()*Math.PI*2,d=2.4+r()*8;const x=Math.cos(a)*d,z=Math.sin(a)*d;if(RING.some(([px,pz])=>Math.hypot(px-x,pz-z)<2.5))continue;const t=new THREE.Group();t.position.set(x,-.16,z);scene.add(t);r()<.8?tree(t,0,0,1.3+r(),r()<.5?'pine':'leaf',r):rock(t,0,0,.08+r()*.1)}}
// a river along one side
{const pts=[[-11,6.5],[-6,7.4],[-1,8.4],[4,7.6],[8,8.6],[11,8]];for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const w=add(scene,new THREE.BoxGeometry(L+.6,.04,1.1),C.water,(a[0]+b[0])/2,-.17,(a[1]+b[1])/2);w.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]);w.castShadow=false}}

function buildDistrict(i){
  const d=DISTRICTS[i];const g=new THREE.Group();const[x,z]=RING[i];g.position.set(x,0,z);g.rotation.y=[0,.18,-.12,.1,-.2,.15][i];
  const plinth=add(g,new THREE.BoxGeometry(3*PITCH+.2,.14,3*PITCH+.2),C.slabTop,0,-.23,0);plinth.castShadow=false;
  d.slots.forEach((t,k)=>{const tile=buildTile(t||'empty',i*100+k*7+1);tile.position.set(((k%3)-1)*PITCH,0,(Math.floor(k/3)-1)*PITCH);tile.userData.slot={d:i,k};tile.traverse(o=>o.userData.slot={d:i,k});g.add(tile);g.userData['t'+k]=tile;tiles.push(tile)});
  scene.add(g);districtGroups[i]=g;
}
DISTRICTS.forEach((_,i)=>buildDistrict(i));
function replaceSlot(di,k,type){const g=districtGroups[di];const old=g.userData['t'+k];g.remove(old);tiles.splice(tiles.indexOf(old),1);DISTRICTS[di].slots[k]=type;const t=buildTile(type||'empty',Math.floor(Math.random()*1e6));t.position.copy(old.position);t.traverse(o=>o.userData.slot={d:di,k});g.add(t);g.userData['t'+k]=t;tiles.push(t);markSel()}

/* selection frame */
const frame=new THREE.Group();scene.add(frame);
for(const[w,d,x,z]of[[1.08,.05,0,.515],[1.08,.05,0,-.515],[.05,1.08,.515,0],[.05,1.08,-.515,0]])add(frame,new THREE.BoxGeometry(w,.03,d),'#c79a3e',x,.02,z,{emissive:'#6a4e18'});
const hoverF=frame.clone();hoverF.traverse(o=>{if(o.isMesh)o.material=M('#fbf7ee',{emissive:'#776'})});scene.add(hoverF);hoverF.visible=false;

/* ------------------------------------------------------------------ camera */
const view={tx:0,tz:.2,zoom:15.5,ang:Math.PI/4};let goal={...view};
function placeCam(){const R=40;cam.position.set(view.tx+Math.cos(view.ang)*R,R*.82,view.tz+Math.sin(view.ang)*R);cam.lookAt(view.tx,0,view.tz);const a=innerWidth/innerHeight,h=view.zoom/2;cam.left=-h*a;cam.right=h*a;cam.top=h;cam.bottom=-h;cam.updateProjectionMatrix()}
function resize(){renderer.setSize(innerWidth,innerHeight);placeCam()}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ state + UI */
let mode='city',cur=0,sel=4;
const $=id=>document.getElementById(id);
const pop=n=>n>=1000?(n/1000).toFixed(1)+'k':n;
const used=d=>d.slots.filter(Boolean).length;
const tags=DISTRICTS.map((d,i)=>{const t=document.createElement('div');t.className='tag';t.innerHTML=`<b>${d.name}</b><small>${d.note} · ${used(d)}/9</small>`;document.body.appendChild(t);return t});
function focus(i){mode='district';cur=i;sel=4;const[x,z]=RING[i];goal={...goal,tx:x+0.0,tz:z,zoom:5.4};ui()}
function city(){mode='city';goal={...goal,tx:0,tz:.2,zoom:15.5};ui()}
function markSel(){if(mode!=='district'){frame.visible=false;return}const t=districtGroups[cur].userData['t'+sel];frame.visible=true;t.getWorldPosition(frame.position);frame.position.y=.01;frame.rotation.y=districtGroups[cur].rotation.y}
function ui(){
  const total=POP.reduce((a,b)=>a+b,0);
  $('crumb').innerHTML=mode==='city'?`<span>Aurelians</span><span>›</span><span>City</span>`:`<span>Aurelians</span><span>›</span><a id="cl">Corin</a><span>›</span><span>${DISTRICTS[cur].name}</span>`;
  if(mode!=='city')$('cl').onclick=city;
  $('title').textContent=mode==='city'?'Corin':DISTRICTS[cur].name;
  $('sub').textContent=mode==='city'?`Capital · ${pop(total)} people · 6 of 6 districts`:`${DISTRICTS[cur].note} · ${used(DISTRICTS[cur])} of 9 slots built`;
  $('dlist').innerHTML=DISTRICTS.map((d,i)=>`<button class="dl ${mode==='district'&&i===cur?'on':''}" data-i="${i}"><span><b>${d.name}</b><small>${d.note}</small></span><span class="n">${used(d)}/9</span></button>`).join('');
  $('dlist').querySelectorAll('.dl').forEach(b=>b.onclick=()=>focus(+b.dataset.i));
  $('back').disabled=mode==='city';
  $('next').innerHTML=(mode==='city'?'Open centre':'Next district')+`<svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const insp=$('insp');
  if(mode==='city'){
    insp.innerHTML=`<span class="label">City</span><h2>Six districts</h2>
    <p style="margin:0;color:var(--muted)">A city grows from its centre to as many as six districts, each a 3×3 grid of buildings. Click a district to open it.</p>
    <div class="label">Growth</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px">
      <span>Village</span><span class="muted">centre only</span><span>Town</span><span class="muted">2 districts</span><span>City</span><span class="muted">3–4 districts</span><span>Metropolis</span><span class="muted">5 districts</span><span>Megalopolis</span><span class="muted">6 districts</span></div>
    <div class="label">Buildings in Corin</div>
    <div class="slot-cap" style="flex-wrap:wrap;gap:6px 12px;font-size:14px">${Object.entries(GROUPS).map(([k,[n,c]])=>{const cnt=DISTRICTS.flatMap(d=>d.slots).filter(s=>s&&SLOTS[s].g===k).length;return `<span class="slot-cap"><i style="background:${c}"></i>${n} ${cnt}</span>`}).join('')}</div>`;
  }else{
    const d=DISTRICTS[cur],t=d.slots[sel],info=t?SLOTS[t]:null;
    insp.innerHTML=`<span class="label">Selected slot</span>
    <div><h2>${info?info.name:'Empty slot'}</h2>${info?`<span class="grp"><i style="background:${GROUPS[info.g][1]}"></i>${GROUPS[info.g][0]}</span>`:'<span class="grp">Choose a building below</span>'}</div>
    <div class="mini3">${d.slots.map((s,k)=>`<span data-k="${k}" class="${k===sel?'sel':''}" style="${s?`border-color:${GROUPS[SLOTS[s].g][1]}`:''}">${s?SLOTS[s].name:'·'}</span>`).join('')}</div>
    <span class="label">Build here</span>
    <div class="picker">${Object.entries(GROUPS).map(([k,[n,c]])=>`<div class="pg"><h4><i style="background:${c}"></i>${n}</h4><div>${Object.entries(SLOTS).filter(([,v])=>v.g===k).map(([id,v])=>`<button class="pk ${id===t?'on':''}" data-id="${id}">${v.name}</button>`).join('')}</div></div>`).join('')}
    <div class="pg"><div><button class="pk" data-id="">Clear slot</button></div></div></div>`;
    insp.querySelectorAll('.mini3 span').forEach(s=>s.onclick=()=>{sel=+s.dataset.k;ui()});
    insp.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{replaceSlot(cur,sel,b.dataset.id||null);ui()});
  }
  tags.forEach((t,i)=>{t.querySelector('small').textContent=`${DISTRICTS[i].note} · ${used(DISTRICTS[i])}/9`});
  markSel();
}
$('back').onclick=city;
$('next').onclick=()=>focus(mode==='city'?0:(cur+1)%6);
$('rotL').onclick=()=>goal.ang-=Math.PI/2;
$('rotR').onclick=()=>goal.ang+=Math.PI/2;
$('zin').onclick=()=>goal.zoom=Math.max(2.5,goal.zoom*.8);
$('zout').onclick=()=>goal.zoom=Math.min(24,goal.zoom*1.25);
addEventListener('keydown',e=>{if(e.key==='Escape')city();if(e.key==='q')goal.ang-=Math.PI/2;if(e.key==='e')goal.ang+=Math.PI/2});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();goal.zoom=Math.min(24,Math.max(2.5,goal.zoom*(e.deltaY>0?1.12:.89)))},{passive:false});

/* picking */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
function pick(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(tiles,true)[0];return h?.object.userData.slot}
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY,goal.tx,goal.tz]});
renderer.domElement.addEventListener('pointermove',e=>{
  if(downAt&&(e.buttons&1)){const dx=e.clientX-downAt[0],dy=e.clientY-downAt[1];if(Math.hypot(dx,dy)>4){const s=view.zoom/innerHeight;const a=view.ang;// screen → ground
    const rx=-Math.sin(a),rz=Math.cos(a),fx=-Math.cos(a),fz=-Math.sin(a);goal.tx=downAt[2]-(dx*rx+dy*fx*1.4)*s;goal.tz=downAt[3]-(dx*rz+dy*fz*1.4)*s;downAt.moved=true}}
  const s=pick(e),tip=$('tip');
  if(s){const t=DISTRICTS[s.d].slots[s.k];tip.hidden=false;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.textContent=mode==='city'?DISTRICTS[s.d].name:(t?SLOTS[t].name:'Empty slot');
    const tile=districtGroups[s.d].userData['t'+s.k];if(mode==='district'&&s.d===cur){hoverF.visible=true;tile.getWorldPosition(hoverF.position);hoverF.position.y=.012;hoverF.rotation.y=districtGroups[cur].rotation.y}else hoverF.visible=false;
    renderer.domElement.style.cursor='pointer'}else{tip.hidden=true;hoverF.visible=false;renderer.domElement.style.cursor=''}
});
renderer.domElement.addEventListener('pointerup',e=>{const moved=downAt?.moved;downAt=null;if(moved)return;const s=pick(e);if(!s)return;if(mode==='city'||s.d!==cur)focus(s.d);else{sel=s.k;ui()}if(mode==='district'&&s.d===cur)sel=s.k,ui()});
renderer.domElement.addEventListener('pointerleave',()=>{$('tip').hidden=true;hoverF.visible=false});

/* loop */
const v3=new THREE.Vector3();let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const k=reduce?1:1-Math.pow(.0008,dt);
  for(const p of['tx','tz','zoom','ang'])view[p]+=(goal[p]-view[p])*k;placeCam();
  sun.position.set(view.tx-9,16,view.tz+6);sun.target.position.set(view.tx,0,view.tz);
  scene.traverse(o=>{if(o.userData.spin)o.rotation.z+=dt*1.2;if(o.userData.wheel)o.rotation.x+=dt*1.5});
  // tags over districts in city view
  tags.forEach((t,i)=>{const show=mode==='city'||view.zoom>9;v3.set(RING[i][0],1.3,RING[i][1]).project(cam);t.style.left=(v3.x*.5+.5)*innerWidth+'px';t.style.top=(-v3.y*.5+.5)*innerHeight+'px';t.style.opacity=show?1:0;t.style.visibility=show?'visible':'hidden'});
  renderer.render(scene,cam);requestAnimationFrame(loop)}
ui();requestAnimationFrame(loop);
window.__lp={focus,city,ui};
</script>
